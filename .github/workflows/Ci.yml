name: Build, test, analyze and deploy to Preprod

on:
  push:
    branches:
      - preprod
  workflow_dispatch:

env:
  SPRING_PROFILES_ACTIVE: ${{ secrets.SPRING_PROFILES_ACTIVE}}
  SPRING_DATA_MONGODB_URI: ${{ secrets.SPRING_DATA_MONGODB_URI}}
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD}}
  ADMIN_EMAIL: juan.ccastellanos@mailescuelaing.edu.co

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven

      - name: Build with Maven
        run: mvn clean package -DskipTests=false

      - name: Run tests
        run: mvn test 

      - name: Static Code Analysis (SonarQube)
        uses: sonarsource/sonarqube-scan-action@v3
        with:
          args: >
            -Dsonar.projectKey=pawpatrol_preprod
            -Dsonar.organization=pawpatrol
            -Dsonar.host.url=${{ secrets.SONAR_HOST }}
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: target/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build-test-analyze
    permissions:
      id-token: write
      contents: read

    environment:
      name: preprod
      url: https://pawpatrol-back-preprod.azurewebsites.net

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pawpatrol-back-preprod'
          slot-name: 'Production'
          package: '*.jar'

      - name: Health Check
        run: |
          echo "Esperando despliegue..."
          sleep 25
          curl -f https://pawpatrol-back-preprod.azurewebsites.net/actuator/health || exit 1

      - name: Notify Deployment Success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": ":white_check_mark: Despliegue *PREPROD* completado exitosamente para commit `${{ github.sha }}`"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_PREPROD }}
